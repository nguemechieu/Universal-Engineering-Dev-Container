services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    command: sleep infinity
    volumes:
      - ..:/workspace:cached
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql://dev:local_dev_only@postgres:5432/dev
      REDIS_URL: redis://valkey:6379/0
      NATS_URL: nats://nats:4222
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      nats:
        condition: service_started
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U dev -d dev']
      interval: 5s
      timeout: 3s
      retries: 20
  valkey:
    image: valkey/valkey:8
    command: [valkey-server, --appendonly, 'yes']
    volumes:
      - valkey_data:/data
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  nats:
    image: nats:2.11-alpine
    command: ['-js', '-sd', '/data', '-m', '8222']
    volumes:
      - nats_data:/data
volumes:
  postgres_data:
  valkey_data:
  nats_data:
